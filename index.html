<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173c32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Tu cartera de fondos indexados, con perspectiva. Aportaciones, rentabilidad y simulación, privadas en tu dispositivo.">
  <title>Raíz · Tu cartera, con perspectiva</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css"><script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#resumen" aria-label="Raíz, inicio"><img src="./icon.svg" alt="" width="38" height="38"><span>raíz<span class="brand-dot">.</span></span></a>
      <p class="brand-caption">TU CARTERA, CON PERSPECTIVA</p>
      <nav class="main-nav" aria-label="Navegación principal">
        <button data-page="resumen"><span data-icon="dashboard"></span><span>Resumen</span></button>
        <button data-page="historial"><span data-icon="list"></span><span>Historial</span></button>
        <button data-page="simulador"><span data-icon="spark"></span><span>Simulador</span></button>
        <button data-page="ajustes"><span data-icon="settings"></span><span>Tu espacio</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="sprout" aria-hidden="true">↗</div><p>Lo pequeño, sostenido<br>en el tiempo, crece.</p><span class="local-badge"><i></i> Datos en tu dispositivo</span></div>
    </aside>
    <main id="main" tabindex="-1">
      <header class="topbar"><span class="mobile-brand">raíz.</span><span class="eyebrow" id="today-label"></span><div class="top-actions"><button id="share-btn" class="icon-btn" aria-label="Compartir aplicación" title="Compartir aplicación"><span data-icon="share"></span></button><span class="avatar" aria-label="Cartera personal">R</span></div></header>
      <div id="demo-bar" class="demo-bar" hidden><span>Estás explorando una cartera de ejemplo.</span><button id="exit-demo">Volver a mi cartera <span>↗</span></button></div>
      <div id="storage-warning" class="warning" hidden>No se pueden guardar los cambios en este navegador. Exporta una copia antes de cerrar.</div>
      <div id="view"></div>
      <footer class="page-footer"><span>Hecho para mirar a largo plazo.</span><span>raíz.</span></footer>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <noscript>Raíz necesita JavaScript para guardar los registros y calcular tu cartera en este dispositivo.</noscript>
</body>
</html>
